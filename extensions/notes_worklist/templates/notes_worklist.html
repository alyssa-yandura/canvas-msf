        // Status dropdown — custom because of the preset buttons and because
        // each "option" is a logical bucket (Open / Closed / Booked / etc.)
        // that may bundle multiple underlying NoteStates.
        function populateStatusDropdown() {
            const dropdownOptions = document.getElementById('state-options');
            const optionsHtml = FILTER_OPTIONS.map(opt => {
                const checked = isOptionChecked(opt) ? 'checked' : '';
                return `
                    <div class="dropdown-option" data-option-id="${opt.id}">
                        <input type="checkbox" id="state-${opt.id}" ${checked}>
                        <label for="state-${opt.id}">${escapeHtml(opt.label)}</label>
                    </div>`;
            }).join('');

            // Remove any previously-rendered options (preset buttons stay).
            dropdownOptions.querySelectorAll('.dropdown-option, .dropdown-section').forEach(el => el.remove());
            dropdownOptions.insertAdjacentHTML('beforeend', optionsHtml);
        }

        function setStatusFromOptionIds(optionIds) {
            currentFilters.state_filter = statesForOptionIds(optionIds);
            // Re-sync the visible checkboxes to match the new state.
            const options = document.getElementById('state-options');
            options.querySelectorAll('.dropdown-option').forEach(opt => {
                const optionId = opt.getAttribute('data-option-id');
                const filterOpt = FILTER_OPTIONS.find(o => o.id === optionId);
                const checkbox = opt.querySelector('input[type="checkbox"]');
                if (checkbox && filterOpt) {
                    checkbox.checked = isOptionChecked(filterOpt);
                }
            });
            updateStatusDisplay();
        }

        function updateStatusDisplay() {
            const dropdown = document.getElementById('stateFilter');
            const selectedValue = dropdown.querySelector('.selected-value');
            const selected = currentFilters.state_filter;

            // Which preset (if any) does the current selection match exactly?
            const matchesPreset = (presetIds) => {
                const expected = statesForOptionIds(presetIds);
                return expected.length === selected.length && expected.every(n => selected.includes(n));
            };

            let html;
            if (selected.length === 0) {
                html = '<span class="placeholder-text">None selected</span>';
            } else if (matchesPreset(FILTER_PRESETS.open)) {
                html = '<span class="placeholder-text">All Open</span>';
            } else if (matchesPreset(FILTER_PRESETS.closed)) {
                html = '<span class="placeholder-text">All Closed</span>';
            } else if (matchesPreset(FILTER_PRESETS.appointment)) {
                html = '<span class="placeholder-text">All Appointment</span>';
            } else if (matchesPreset(FILTER_PRESETS.all)) {
                html = '<span class="placeholder-text">All</span>';
            } else {
                // Show as removable tags. With only 6 options total, tags always fit.
                const checkedOptions = FILTER_OPTIONS.filter(isOptionChecked);
                html = checkedOptions.map(opt =>
                    `<span class="selected-tag">${escapeHtml(opt.label)}<span class="remove-tag" data-option-id="${opt.id}">×</span></span>`
                ).join('');
            }
            selectedValue.innerHTML = html;

            // Wire remove-tag handlers
            selectedValue.querySelectorAll('.remove-tag').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const optionId = btn.getAttribute('data-option-id');
                    const opt = FILTER_OPTIONS.find(o => o.id === optionId);
                    if (!opt) return;
                    currentFilters.state_filter = currentFilters.state_filter.filter(n => !opt.stateNames.includes(n));
                    const checkbox = document.getElementById(`state-${optionId}`);
                    if (checkbox) checkbox.checked = false;
                    updateStatusDisplay();
                    refreshLocationOptions();
                });
            });
        }

        function applyStatePreset(presetName) {
            const presetIds = FILTER_PRESETS[presetName];
            if (!presetIds) return;
            setStatusFromOptionIds(presetIds);
            // Location options depend on which states are selected — re-fetch to stay in sync.
            refreshLocationOptions();
        }

        function setupStatusDropdown() {
            const dropdown = document.getElementById('stateFilter');
            const options = document.getElementById('state-options');

            // Open/close on header click (but not when clicking inside the dropdown body).
            dropdown.addEventListener('click', (e) => {
                if (e.target.closest('.dropdown-option') || e.target.closest('.preset-btn')) return;
                if (e.target.closest('.remove-tag')) return;
                if (e.target.closest('.dropdown-search') || e.target.closest('.dropdown-clear-btn')) return;
                closeAllDropdowns();
                dropdown.classList.toggle('open');
                options.classList.toggle('show');
            });

            // Preset buttons
            options.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    applyStatePreset(btn.getAttribute('data-preset'));
                });
            });

            // Clear button: matches other dropdowns' Clear semantically — "no
            // constraint, show everything." Uses the "all" preset (still
            // excludes Deleted per the opt-in rule).
            document.getElementById('state-clear-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                applyStatePreset('all');
            });

            // Search input: filters visible state options as the user types.
            // With only 6 options this is mostly cosmetic, but it matches the
            // visual pattern of the other multi-select dropdowns.
            const searchInput = document.getElementById('state-search');
            searchInput.addEventListener('click', (e) => e.stopPropagation());
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                options.querySelectorAll('.dropdown-option').forEach(opt => {
                    const labelEl = opt.querySelector('label');
                    const text = labelEl ? labelEl.textContent.toLowerCase() : '';
                    opt.style.display = text.includes(term) ? '' : 'none';
                });
            });

            // Option checkbox toggling. Each "option" bundles one or more
            // NoteStates that get added/removed together.
            options.addEventListener('click', (e) => {
                e.stopPropagation();
                const optionEl = e.target.closest('.dropdown-option');
                if (!optionEl) return;
                const optionId = optionEl.getAttribute('data-option-id');
                if (!optionId) return;
                const opt = FILTER_OPTIONS.find(o => o.id === optionId);
                if (!opt) return;
                const checkbox = optionEl.querySelector('input[type="checkbox"]');
                if (!checkbox) return;

                checkbox.checked = !checkbox.checked;
                if (checkbox.checked) {
                    opt.stateNames.forEach(name => {
                        if (!currentFilters.state_filter.includes(name)) {
                            currentFilters.state_filter.push(name);
                        }
                    });
                } else {
                    currentFilters.state_filter = currentFilters.state_filter.filter(n => !opt.stateNames.includes(n));
                }
                updateStatusDisplay();
                refreshLocationOptions();
            });

            updateStatusDisplay();
        }

        function setupFilterEventListeners() {
            const uncommittedCommandsFilter = document.getElementById('uncommittedCommandsFilter');
            const clearFiltersButton = document.getElementById('clearFilters');
            const printButton = document.getElementById('printButton');
            const applyFiltersButton = document.getElementById('applyFilters');
            const moreFiltersToggle = document.getElementById('moreFiltersToggle');
            const patientSearchInput = document.getElementById('patientSearchInput');
            const dosStartInput = document.getElementById('dosStartInput');
            const dosEndInput = document.getElementById('dosEndInput');

            setupProviderDropdown();
            setupLocationDropdown();
            setupNoteTypeDropdown();
            setupClaimQueueDropdown();
            setupStatusDropdown();

            // Uncommitted commands filter change
            uncommittedCommandsFilter.addEventListener('change', () => {
                currentFilters.has_uncommitted_commands = uncommittedCommandsFilter.checked;
            });

            if (patientSearchInput) {
                patientSearchInput.addEventListener('input', () => {
                    currentFilters.patient_search = patientSearchInput.value.trim();
                });

                patientSearchInput.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        currentFilters.patient_search = patientSearchInput.value.trim();
                        applyFilters();
                    }
                });
            }

            if (dosStartInput) {
                dosStartInput.addEventListener('change', () => {
                    currentFilters.dos_start = dosStartInput.value;
                });
            }

            if (dosEndInput) {
                dosEndInput.addEventListener('change', () => {
                    currentFilters.dos_end = dosEndInput.value;
                });
            }

            // Clear All button
            clearFiltersButton.addEventListener('click', () => {
                // Reset all filters first
                currentFilters.provider_ids = [];
                currentFilters.location_ids = [];
                currentFilters.note_type_names = [];
                currentFilters.claim_queue_names = [];
                currentFilters.has_uncommitted_commands = false;
                currentFilters.patient_search = '';
                currentFilters.dos_start = '';
                currentFilters.dos_end = '';
                // Reset Status to the Open preset (the default) rather than empty,
                // which would render an empty worklist and confuse the user.
                applyStatePreset('open');

                // Reset UI elements
                uncommittedCommandsFilter.checked = false;
                if (patientSearchInput) {
                    patientSearchInput.value = '';
                }
                if (dosStartInput) {
                    dosStartInput.value = '';
                }
                if (dosEndInput) {
                    dosEndInput.value = '';
                }

                // Helper function to reset dropdown checkboxes
                const resetDropdownCheckboxes = (optionsId, filterKey) => {
                    const options = document.getElementById(optionsId);
                    if (options) {
                        const checkboxes = options.querySelectorAll('input[type="checkbox"]');
                        checkboxes.forEach(checkbox => {
                            if (checkbox.id === `${filterKey}-all`) {
                                checkbox.checked = true;
                            } else {
                                checkbox.checked = false;
                            }
                        });
                    }
                };

                // Helper function to reset dropdown display
                const resetDropdownDisplay = (dropdownId, placeholderText) => {
                    const dropdown = document.getElementById(dropdownId);
                    if (dropdown) {
                        const selectedValue = dropdown.querySelector('.selected-value');
                        if (selectedValue) {
                            selectedValue.innerHTML = `<span class="placeholder-text">${placeholderText}</span>`;
                        }
                    }
                };

                // Reset provider dropdown
                resetDropdownCheckboxes('provider-options', 'provider_ids');
                resetDropdownDisplay('providerFilter', 'All Owners');

                // Reset location dropdown
                resetDropdownCheckboxes('location-options', 'location_ids');
                resetDropdownDisplay('locationFilter', 'All Locations');

                // Reset note type dropdown
                resetDropdownCheckboxes('note-type-options', 'note_type_names');
                resetDropdownDisplay('noteTypeFilter', 'All Note Types');

                // Reset claim queue dropdown
                resetDropdownCheckboxes('claim-queue-options', 'claim_queue_names');
                resetDropdownDisplay('claimQueueFilter', 'All Statuses');

                // Apply cleared filters
                applyFilters();
            });

            // Apply Filters button
            applyFiltersButton.addEventListener('click', () => {
                const patientSearchInput = document.getElementById('patientSearchInput');
                const dosStartInput = document.getElementById('dosStartInput');
                const dosEndInput = document.getElementById('dosEndInput');
                if (patientSearchInput) {
                    currentFilters.patient_search = patientSearchInput.value.trim();
                }
                if (dosStartInput) {
                    currentFilters.dos_start = dosStartInput.value;
                }
                if (dosEndInput) {
                    currentFilters.dos_end = dosEndInput.value;
                }
                applyFilters();
            });

            // Print button — fetches ALL matching rows, renders them, triggers
            // the browser's print dialog, then restores the paginated view after.
            if (printButton) {
                printButton.addEventListener('click', () => printWorklist());
            }

            // "More filters" disclosure toggle.
            if (moreFiltersToggle) {
                moreFiltersToggle.addEventListener('click', () => {
                    const group = document.getElementById('moreFiltersGroup');
                    const isHidden = group.classList.toggle('hidden');
                    moreFiltersToggle.setAttribute('aria-expanded', String(!isHidden));
                    moreFiltersToggle.textContent = isHidden ? '+ More filters' : '− Fewer filters';
                });
            }
        }

        async function printWorklist() {
            const printButton = document.getElementById('printButton');
            const originalLabel = printButton.textContent;
            printButton.disabled = true;
            printButton.textContent = 'Preparing…';

            try {
                // Fetch every matching row (skips pagination on the backend).
                // Pass allResults so paginationData is not overwritten — we'll
                // need it intact to restore the paginated view after printing.
                await fetchEncounters(currentFilters, 1, { allResults: true });
                renderTable();
                // Synchronously open the print dialog; modern browsers return
                // immediately and dispatch 'afterprint' when the user closes it.
                window.print();
            } catch (error) {
                console.error('Print preparation failed:', error);
                alert('Could not prepare print view. Please try again.');
            } finally {
                printButton.disabled = false;
                printButton.textContent = originalLabel;
            }

            // Restore paginated view after the print dialog closes. afterprint
            // is well-supported in modern browsers; a 30-second fallback prevents
            // the user from being stranded with hundreds of rows if it doesn't fire.
            let restored = false;
            const restore = async () => {
                if (restored) return;
                restored = true;
                await fetchEncounters(currentFilters, paginationData.current_page);
                renderTable();
                updateEncounterCount();
                updatePaginationControls();
            };
            window.addEventListener('afterprint', restore, { once: true });
            setTimeout(restore, 30000);
        }

        // -----------------------------------------------------------------
        // Saved Views
        // -----------------------------------------------------------------

        // In-memory cache of views loaded from the backend. Indexed by view id.
        let savedViews = [];
        let currentViewId = null;

        const LAST_VIEW_KEY = 'notes_worklist:last_view_id';

        async function fetchSavedViews() {
            try {
                const response = await fetch(`${API_BASE_URL}/views`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                savedViews = data.views || [];
            } catch (err) {
                console.error('Error fetching saved views:', err);
                savedViews = [];
            }
        }

        function renderViewsDropdown() {
            const select = document.getElementById('viewsSelect');
            if (!select) return;
            const ownerLabel = (v) => v.is_mine ? '' : ` (shared by ${v.creator_name || 'unknown'})`;
            const options = ['<option value="">— current filters —</option>']
                .concat(savedViews.map(v =>
                    `<option value="${v.id}">${escapeHtml(v.name)}${escapeHtml(ownerLabel(v))}</option>`
                ));
            select.innerHTML = options.join('');
            select.value = currentViewId || '';
            updateDeleteViewButton();
        }

        function expandMoreFiltersIfNeeded() {
            const hasMore =
                (currentFilters.note_type_names && currentFilters.note_type_names.length > 0) ||
                (currentFilters.claim_queue_names && currentFilters.claim_queue_names.length > 0) ||
                currentFilters.has_uncommitted_commands;
            if (!hasMore) return;
            const group = document.getElementById('moreFiltersGroup');
            const toggle = document.getElementById('moreFiltersToggle');
            if (group && group.classList.contains('hidden')) {
                group.classList.remove('hidden');
                if (toggle) {
                    toggle.setAttribute('aria-expanded', 'true');
                    toggle.textContent = '− Fewer filters';
                }
            }
        }

        function updateDeleteViewButton() {
            const btn = document.getElementById('deleteViewMenuItem');
            if (!btn) return;
            const view = savedViews.find(v => v.id === currentViewId);
            btn.disabled = !(view && view.is_mine);
        }

        function applySavedView(viewId) {
            const view = savedViews.find(v => v.id === viewId);
            if (!view) {
                currentViewId = null;
                localStorage.removeItem(LAST_VIEW_KEY);
                updateDeleteViewButton();
                return;
            }
            // Replace currentFilters with the view's snapshot. Use spread so
            // we don't share array references with the saved view object.
            const f = view.filters || {};
            currentFilters = {
                provider_ids: [...(f.provider_ids || [])],
                location_ids: [...(f.location_ids || [])],
                note_type_names: [...(f.note_type_names || [])],
                claim_queue_names: [...(f.claim_queue_names || [])],
                state_filter: (f.state_filter && f.state_filter.length)
                    ? [...f.state_filter]
                    : statesForOptionIds(FILTER_PRESETS.open),
                has_uncommitted_commands: !!f.has_uncommitted_commands,
                patient_search: f.patient_search || '',
                dos_start: f.dos_start || '',
                dos_end: f.dos_end || '',
            };
            sortConfig = {
                key: view.sort_by || null,
                direction: view.sort_direction === 'desc' ? 'desc' : 'asc',
            };
            currentViewId = viewId;
            localStorage.setItem(LAST_VIEW_KEY, viewId);

            // Sync all the filter UI controls with the new state.
            populateProviderDropdown();
            populateLocationDropdown();
            populateNoteTypeDropdown();
            populateClaimQueueDropdown();
            populateStatusDropdown();
            updateDropdownDisplay('providerFilter', 'provider_ids');
            updateDropdownDisplay('locationFilter', 'location_ids');
            updateDropdownDisplay('noteTypeFilter', 'note_type_names');
            updateDropdownDisplay('claimQueueFilter', 'claim_queue_names');
            updateStatusDisplay();

            const patientInput = document.getElementById('patientSearchInput');
            if (patientInput) patientInput.value = currentFilters.patient_search;
            const dosStart = document.getElementById('dosStartInput');
            if (dosStart) dosStart.value = currentFilters.dos_start;
            const dosEnd = document.getElementById('dosEndInput');
            if (dosEnd) dosEnd.value = currentFilters.dos_end;
            const uncomm = document.getElementById('uncommittedCommandsFilter');
            if (uncomm) uncomm.checked = !!currentFilters.has_uncommitted_commands;

            // If the saved view sets any "More filters" (Note Type, Claim Queue,
            // Has Uncommitted Commands), expand the disclosure so the user can
            // see them — otherwise the filter would silently affect the worklist.
            expandMoreFiltersIfNeeded();

            updateDeleteViewButton();
            applyFilters();
        }

        function openSaveViewModal() {
            const modal = document.getElementById('saveViewModal');
            const nameInput = document.getElementById('saveViewName');
            modal.classList.remove('hidden');
            nameInput.value = '';
            document.querySelector('input[name="saveViewVisibility"][value="private"]').checked = true;
            setTimeout(() => nameInput.focus(), 50);
        }

        function closeSaveViewModal() {
            document.getElementById('saveViewModal').classList.add('hidden');
        }

        async function submitSaveView() {
            const nameInput = document.getElementById('saveViewName');
            const name = nameInput.value.trim();
            if (!name) {
                nameInput.focus();
                return;
            }
            const visibility = document.querySelector('input[name="saveViewVisibility"]:checked').value;
            const submitBtn = document.getElementById('saveViewSubmit');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving…';
            try {
                const response = await fetch(`${API_BASE_URL}/views`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        visibility,
                        filters: { ...currentFilters },
                        sort_by: sortConfig.key || '',
                        sort_direction: sortConfig.direction || 'asc',
                    }),
                });
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    alert(`Could not save view: ${errData.error || response.statusText}`);
                    return;
                }
                const data = await response.json();
                if (data.view) {
                    savedViews.push(data.view);
                    savedViews.sort((a, b) => a.name.localeCompare(b.name));
                    currentViewId = data.view.id;
                    localStorage.setItem(LAST_VIEW_KEY, currentViewId);
                    renderViewsDropdown();
                }
                closeSaveViewModal();
            } catch (err) {
                console.error('Save view failed:', err);
                alert('Could not save view. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save';
            }
        }

        async function deleteCurrentView() {
            const view = savedViews.find(v => v.id === currentViewId);
            if (!view || !view.is_mine) return;
            if (!confirm(`Delete view "${view.name}"?`)) return;
            try {
                const response = await fetch(`${API_BASE_URL}/views?id=${encodeURIComponent(currentViewId)}`, {
                    method: 'DELETE',
                });
                if (!response.ok) {
                    alert('Could not delete view.');
                    return;
                }
                savedViews = savedViews.filter(v => v.id !== currentViewId);
                currentViewId = null;
                localStorage.removeItem(LAST_VIEW_KEY);
                renderViewsDropdown();
            } catch (err) {
                console.error('Delete view failed:', err);
                alert('Could not delete view. Please try again.');
            }
        }

        function setupSavedViewsListeners() {
            const select = document.getElementById('viewsSelect');
            const kebabBtn = document.getElementById('viewMenuButton');
            const kebabMenu = document.getElementById('viewMenu');
            const saveItem = document.getElementById('saveViewMenuItem');
            const delItem = document.getElementById('deleteViewMenuItem');
            const closeBtn = document.getElementById('saveViewClose');
            const cancelBtn = document.getElementById('saveViewCancel');
            const submitBtn = document.getElementById('saveViewSubmit');
            const nameInput = document.getElementById('saveViewName');

            select.addEventListener('change', (e) => applySavedView(e.target.value));

            // Kebab menu: toggle open on button click, close on outside click,
            // close after any menu item action.
            const closeKebab = () => kebabMenu.classList.add('hidden');
            kebabBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                kebabMenu.classList.toggle('hidden');
            });
            document.addEventListener('click', (e) => {
                if (!kebabMenu.classList.contains('hidden') &&
                    !kebabMenu.contains(e.target) &&
                    e.target !== kebabBtn) {
                    closeKebab();
                }
            });
            saveItem.addEventListener('click', () => { closeKebab(); openSaveViewModal(); });
            delItem.addEventListener('click', () => { closeKebab(); deleteCurrentView(); });

            closeBtn.addEventListener('click', closeSaveViewModal);
            cancelBtn.addEventListener('click', closeSaveViewModal);
            submitBtn.addEventListener('click', submitSaveView);
            nameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); submitSaveView(); }
            });
        }

        async function applyFilters() {
            try {
                // Show loading state
                showLoadingSpinner();
                document.getElementById('encounterCount').textContent = 'Loading notes...';
                
                const patientSearchInput = document.getElementById('patientSearchInput');
                const dosStartInput = document.getElementById('dosStartInput');
                const dosEndInput = document.getElementById('dosEndInput');
                if (patientSearchInput) {
                    currentFilters.patient_search = patientSearchInput.value.trim();
                }
                if (dosStartInput) {
                    currentFilters.dos_start = dosStartInput.value;
                }
                if (dosEndInput) {
                    currentFilters.dos_end = dosEndInput.value;
                }
                
                // Reset to page 1 when applying filters
                await fetchEncounters(currentFilters, 1);
                
                // Re-render the table with filtered data
                renderTable();
                updateEncounterCount();
                updatePaginationControls();
                updateSortIndicators();
                hideLoadingSpinner();
            } catch (error) {
                console.error('Error applying filters:', error);
                document.getElementById('encounterCount').textContent = 'Error loading notes';
                hideLoadingSpinner();
            }
        }

        // Pagination functions
        function updatePaginationControls() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            const pageNumbers = document.getElementById('pageNumbers');
            const paginationInfo = document.getElementById('paginationInfo');

            // Update button states
            prevButton.disabled = !paginationData.has_previous;
            nextButton.disabled = !paginationData.has_next;
            
            // Update button styles based on state
            prevButton.style.opacity = paginationData.has_previous ? '1' : '0.5';
            nextButton.style.opacity = paginationData.has_next ? '1' : '0.5';
            prevButton.style.cursor = paginationData.has_previous ? 'pointer' : 'not-allowed';
            nextButton.style.cursor = paginationData.has_next ? 'pointer' : 'not-allowed';

            // Update page numbers display
            pageNumbers.textContent = `Page ${paginationData.current_page} of ${paginationData.total_pages}`;

            // Update pagination info
            if (paginationData.total_count === 0) {
                paginationInfo.textContent = 'No notes found';
            } else {
                const start = (paginationData.current_page - 1) * paginationData.page_size + 1;
                const end = Math.min(start + encounterData.length - 1, paginationData.total_count);
                paginationInfo.textContent = `Showing ${start}-${end} of ${paginationData.total_count} notes`;
            }
        }

        async function goToPage(page) {
            if (page < 1 || page > paginationData.total_pages) {
                return;
            }

            try {
                // Show loading state
                showLoadingSpinner();
                document.getElementById('encounterCount').textContent = 'Loading notes...';
                
                await fetchEncounters(currentFilters, page);
                renderTable();
                updateEncounterCount();
                updatePaginationControls();
                updateSortIndicators();
                hideLoadingSpinner();
            } catch (error) {
                console.error('Error loading page:', error);
                document.getElementById('encounterCount').textContent = 'Error loading notes';
                hideLoadingSpinner();
            }
        }

        function setupPaginationEventListeners() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            const pageSizeSelect = document.getElementById('pageSizeSelect');

            prevButton.addEventListener('click', () => {
                if (paginationData.has_previous) {
                    goToPage(paginationData.current_page - 1);
                }
            });

            nextButton.addEventListener('click', () => {
                if (paginationData.has_next) {
                    goToPage(paginationData.current_page + 1);
                }
            });

            // Page size change handler
            pageSizeSelect.addEventListener('change', async () => {
                paginationData.current_page = 1; // Reset to first page when changing page size
                await fetchEncounters(1);
                renderTable();
                updateEncounterCount();
                updatePaginationControls();
                updateSortIndicators();
            });
        }

        // Loading spinner helper functions
        function showLoadingSpinner() {
            const spinner = document.getElementById('loadingSpinner');
            const tableBody = document.getElementById('worklistBody');
            if (spinner && tableBody) {
                spinner.style.display = 'block';
                tableBody.innerHTML = ''; // Clear table content
            }
        }

        function hideLoadingSpinner() {
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) {
                spinner.style.display = 'none';
            }
        }

        // Initialize the worklist
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Load initial data from APIs
                await Promise.all([
                    fetchProviders(),
                    fetchLocations(currentFilters.state_filter),
                    fetchNoteTypes(),
                    fetchClaimQueues(),
                    fetchSavedViews(),
                ]);

                // Populate all filter dropdowns
                populateProviderDropdown();
                populateLocationDropdown();
                populateNoteTypeDropdown();
                populateClaimQueueDropdown();
                populateStatusDropdown();
                renderViewsDropdown();

                // Initialize page size dropdown
                const pageSizeSelect = document.getElementById('pageSizeSelect');
                if (pageSizeSelect) {
                    pageSizeSelect.value = '25'; // Default to 25 records per page
                }

                // Show loading spinner for initial load
                showLoadingSpinner();
                document.getElementById('encounterCount').textContent = 'Loading notes...';

                // Restore last-selected view (per-browser via localStorage) if it still
                // exists and is still visible to the user. Otherwise use default filters.
                const savedLastViewId = localStorage.getItem(LAST_VIEW_KEY);
                if (savedLastViewId && savedViews.some(v => v.id === savedLastViewId)) {
                    applySavedView(savedLastViewId);
                } else {
                    if (savedLastViewId) localStorage.removeItem(LAST_VIEW_KEY);
                    await fetchEncounters();
                }

                // Setup filter event listeners
                setupFilterEventListeners();
                setupSavedViewsListeners();

                // Setup sorting listeners
                setupSortingListeners();

                // Setup pagination listeners
                setupPaginationEventListeners();

                // Render the initial table
                renderTable();
                updateEncounterCount();
                updatePaginationControls();
                updateSortIndicators();
                hideLoadingSpinner();
                
                // Setup refresh functionality
                window.refreshEncounters = async () => {
                    await fetchEncounters(currentFilters, paginationData.current_page);
                    renderTable();
                    updateEncounterCount();
                    updatePaginationControls();
                    updateSortIndicators();
                };

                // Global click listener to close dropdowns when clicking outside
                document.addEventListener('click', (e) => {
                    // Check if the click was on a dropdown or its children
                    const clickedDropdown = e.target.closest('.filter-dropdown');
                    const isDropdownClick = clickedDropdown !== null;
                    
                    if (!isDropdownClick) {
                        closeAllDropdowns();
                    }
                });

            } catch (error) {
                console.error('Error initializing encounter worklist:', error);
                // Show error state in the UI
                document.getElementById('worklistBody').innerHTML = 
                    '<tr><td colspan="9" class="error-row">Error loading notes. Please refresh the page.</td></tr>';
                document.getElementById('encounterCount').textContent = 'Error loading data';
                hideLoadingSpinner();
            }
        });
    </script>
</body>
</html>
